<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-labelledby="emisha-favicon-title">
  <title id="emisha-favicon-title">Emisha</title>
  <defs>
    <linearGradient id="emisha-hex" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4aa8ea"/>
      <stop offset="1" stop-color="#2f6fc0"/>
    </linearGradient>
  </defs>

  <!-- Hexágono de marca, esquinas redondeadas mediante stroke-linejoin -->
