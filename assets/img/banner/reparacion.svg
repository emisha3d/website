<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" preserveAspectRatio="xMidYMid meet" fill="none"
     stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
  <!-- Servicio técnico: un cabezal sobre la cama, con el pulso del diagnóstico -->
  <g opacity=".22" stroke-width="1">
    <path d="M0 44h360M0 88h360M0 132h360M0 176h360"/>
    <path d="M60 0v220M120 0v220M180 0v220M240 0v220M300 0v220"/>
  </g>

  <!-- pórtico -->
  <g stroke-width="2.4" opacity=".95">
    <path d="M74 46h212"/>
    <path d="M96 46v26"/>
    <path d="M264 46v26"/>
  </g>

  <!-- cabezal + boquilla -->
  <g stroke-width="2.4">
    <rect x="150" y="40" width="60" height="42" rx="7"/>
    <path d="M180 82v20"/>
    <path d="M172 102h16l-8 15z" fill="currentColor" stroke="none" opacity=".9"/>
  </g>

  <!-- pieza a medio imprimir sobre la cama -->
  <g stroke-width="2.4">
