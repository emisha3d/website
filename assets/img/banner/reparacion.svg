    <path d="M20 196h44l10-20 12 40 11-26 9 6h222"/>
  </g>

  <!-- llave: la reparación -->
  <g stroke-width="2.4" opacity=".55" transform="translate(272 96) rotate(38)">
    <path d="M0 34c-8-8-8-21 0-29 6-6 15-7 22-4l-9 9 1 12 12 1 9-9c3 7 2 16-4 22-8 8-21 8-29 0z"/>
    <path d="M2 36-16 54"/>
