    <circle cx="286" cy="110" r="96"/><circle cx="286" cy="110" r="68"/><circle cx="286" cy="110" r="40"/>
  </g>

  <!-- placa en perspectiva -->
  <g stroke-width="2.4">
    <path d="M52 150 170 96l138 40-118 56z" opacity=".95"/>
    <path d="M52 150v12l138 46 118-56v-12" opacity=".8"/>
  </g>

  <!-- textura de la superficie -->
  <g stroke-width="1.2" opacity=".45">
    <path d="M82 141 216 180M112 128 246 167M142 115 276 154"/>
    <path d="M96 168 208 122M130 179 242 133"/>
  </g>

